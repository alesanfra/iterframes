[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "iterframes"
description = "Iterate on video frames quickly"
authors = [
    { name = "Alessio Sanfratello", email = "sanfra90@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/alesanfra/iterframes"
Source = "https://github.com/alesanfra/iterframes"

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/abi3-py39"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]  # Enable pycodestyle errors, pyflakes, and isort
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["iterframes"]
