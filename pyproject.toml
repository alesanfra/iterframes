[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "iterframes"
description = "Iterate on video frames quickly"
readme = "README.md"
authors = [{name="Alessio Sanfratello"}]
version = "0.4.0"
requires-python = ">=3.9"
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.16.0",
]

[project.urls]
Homepage = "https://github.com/alesanfra/iterframes"
Repository = "https://github.com/alesanfra/iterframes"

[tool.black]
target_version = ["py36"]
line-length = 79

[tool.isort]
profile = "black"
line_length = 79
